[project]
name = "chansub"
version = "0.1.0"
description = "Subscription management bot for private Telegram channels"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "SQLAlchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "APScheduler>=3.10",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

# Without this, setuptools sees both app/ and migrations/ at the top level
# and refuses to guess which is the package -- breaking `pip install -e .`.
[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]
# Only needed when DATABASE_URL points at PostgreSQL.
postgres = ["asyncpg>=0.29"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
