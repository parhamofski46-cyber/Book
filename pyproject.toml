[project]
name = "chansub"
version = "0.1.0"
description = "Subscription management bot for private Telegram channels"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "SQLAlchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "APScheduler>=3.10",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
